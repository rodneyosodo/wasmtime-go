version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "./.github/workflows"
    schedule:
      interval: "monthly"
      day: "monday"
    groups:
      gh-dependency:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directories:
      - "./"
      - "ci/test-minimal-runtime"
    schedule:
      interval: "monthly"
      day: "monday"
    groups:
      go-dependency:
        patterns:
          - "*"
