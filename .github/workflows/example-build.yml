name: Example Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-example-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - run: python ci/download-wasmtime.py

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install cross-compiler (arm64)
        if: matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install zig (riscv64)
        if: matrix.goarch == 'riscv64'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Install Rust toolchain (riscv64)
        if: matrix.goarch == 'riscv64'
        uses: dtolnay/rust-toolchain@stable

      - name: Build wasmtime for riscv64
        if: matrix.goarch == 'riscv64'
        run: |
          git clone --depth 1 --branch v45.0.0 https://github.com/bytecodealliance/wasmtime.git /tmp/wasmtime
          git -C /tmp/wasmtime submodule update --init
          ./ci/local.sh /tmp/wasmtime riscv64

      - name: Build example (amd64)
        if: matrix.goarch == 'amd64'
        working-directory: example
        run: CGO_ENABLED=1 go build -ldflags "-s -w" ./main.go

      - name: Build example (arm64)
        if: matrix.goarch == 'arm64'
        working-directory: example
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 1
          CC: aarch64-linux-gnu-gcc
        run: go build -ldflags "-s -w" ./main.go

      - name: Build example (riscv64)
        if: matrix.goarch == 'riscv64'
        working-directory: example
        env:
          GOOS: linux
          GOARCH: riscv64
          CGO_ENABLED: 1
          CC: zig cc -target riscv64-linux-gnu
        run: go build -ldflags "-s -w" ./main.go

      - name: Verify binary
        working-directory: example
        run: file main

  build-example-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python ci/download-wasmtime.py

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Build example
        working-directory: example
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: go build -ldflags "-s -w" ./main.go

      - name: Verify binary
        working-directory: example
        run: file main

  build-example-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python ci/download-wasmtime.py

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Build example
        working-directory: example
        env:
          CGO_ENABLED: 1
        run: go build -ldflags "-s -w" ./main.go

      - name: Verify binary
        working-directory: example
        run: file main.exe
